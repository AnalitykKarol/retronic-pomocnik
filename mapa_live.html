<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Mapa na żywo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/lib/leaflet.css">
<style>
:root{--bg:#16161e;--card:#1f2335;--bd:#3b4261;--tx:#c0caf5;--mut:#7a88b8;--ac:#7aa2f7}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px system-ui,sans-serif}
#mapa{position:absolute;inset:0;background:#0b0b10}
#panel{position:absolute;z-index:1000;top:10px;left:50px;width:250px;max-height:calc(100% - 20px);overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px}
#panel h4{margin:8px 0 4px;font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.06em}
#panel h4:first-child{margin-top:0}
label{display:flex;gap:6px;align-items:center;margin:3px 0}
input[type=text],select{width:100%;box-sizing:border-box;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:4px 6px}
.pieta{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.pieta button{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:3px;padding:3px 0;cursor:pointer;font-size:11px}
.pieta button.on{background:var(--ac);color:#16161e;font-weight:700}
.pieta button.sur{border-color:var(--ac)}
#info{color:var(--mut);font-size:12px;line-height:1.5}
.gr{display:flex;justify-content:space-between;gap:6px;cursor:pointer;padding:2px 0}
.gr b{color:var(--ac)}
.leaflet-container{font:inherit}
.pg{width:14px;height:14px;border-radius:50%;background:#f7768e;border:2px solid #fff;box-shadow:0 0 0 3px rgba(247,118,142,.45);animation:p 1.6s infinite}
@keyframes p{50%{box-shadow:0 0 0 8px rgba(247,118,142,0)}}
.lbl{background:rgba(22,22,30,.88);color:#fff;border:1px solid var(--bd);border-radius:4px;padding:1px 5px;font-size:12px;font-weight:600;white-space:nowrap}
.leaflet-tooltip.lbl::before{display:none}
.pre{flex:1;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:4px;cursor:pointer;font-size:11px}.pre:hover{border-color:var(--ac)}
</style></head><body>
<div id="mapa"></div>
<div id="panel">
  <h4>Piętro</h4><div class="pieta" id="pieta"></div>
  <h4>Warstwy</h4>
  <label><input type="checkbox" id="wSp" checked> Spawny (CipSoft 7.4)</label>
  <label><input type="checkbox" id="wZas"> Zasięg wszystkich spawnów</label>
  <label><input type="checkbox" id="wSt" checked> Stwory z gry (live)</label>
  <label><input type="checkbox" id="wFol" checked> Śledź postać</label>
  <label><input type="checkbox" id="wZn" checked> Znaczniki i trasy (znaczniki.json)</label>
  <h4>Szukaj potwora</h4>
  <div style="display:flex;gap:4px;margin-bottom:4px"><button class="pre" data-f="rat,cave rat,wolf,hyaena">🧀 Jedzenie</button><button class="pre" data-f="troll,swamp troll,frost troll">Trolle</button><button class="pre" data-f="">Wszystko</button></div>
  <input type="text" id="szuk" placeholder="np. troll, goblin, dragon">
  <div id="wynik" style="margin-top:4px"></div>
  <h4>Potwory na piętrze (klik = filtr)</h4><div id="leg" style="max-height:180px;overflow:auto"></div>
  <h4>Idź do</h4>
  <input type="text" id="idz" placeholder="x y [z]  np. 32369 32241 7">
  <h4>Postacie</h4><div id="gracze" class="info">brak połączenia z grą</div>
  <h4>Kursor</h4><div id="info">-</div>
</div>
<script src="/lib/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);
const ll=(x,y)=>L.latLng(-y-0.5,x+0.5);
const map=L.map('mapa',{crs:L.CRS.Simple,minZoom:-2,maxZoom:5,zoomSnap:0.5,attributionControl:false,preferCanvas:true});
let piet=+(localStorage.pietro??7), warstwaKafli=null;
const gZn=L.layerGroup().addTo(map),gSp=L.layerGroup().addTo(map), gSt=L.layerGroup().addTo(map), gGr=L.layerGroup().addTo(map);
function kafle(){
  if(warstwaKafli)map.removeLayer(warstwaKafli);
  warstwaKafli=L.tileLayer(`/kafel/${piet}/{z}/{x}/{y}.png`,{tileSize:256,minZoom:-2,maxZoom:5,maxNativeZoom:5,minNativeZoom:-2,noWrap:true,keepBuffer:4,updateWhenZooming:false,updateInterval:150}).addTo(map);
  warstwaKafli.setZIndex(1);
}
const pb=$('pieta');
for(let z=0;z<=15;z++){const b=document.createElement('button');b.textContent=z;if(z===7)b.classList.add('sur');b.onclick=()=>ustaw(z);pb.append(b)}
function ustaw(z){piet=z;try{localStorage.pietro=z}catch(e){}[...pb.children].forEach((b,i)=>b.classList.toggle('on',i===z));kafle();spawny();stwory();znaczniki()}
let znDane=null;
function znaczniki(){
  const rys=()=>{gZn.clearLayers();if(!$('wZn').checked||!znDane)return;
    for(const t of znDane.trasy||[])if(t.z===piet)gZn.addLayer(L.polyline(t.pkt.map(p=>ll(p[0],p[1])),{color:t.kolor||'#ff9e64',weight:3,opacity:.9}).bindTooltip(t.nazwa,{className:'lbl',sticky:true}));
    for(const p of znDane.punkty||[])if(p.z===piet){const c=p.typ==='wejscie'?'#ffd400':p.typ==='start'?'#9ece6a':'#7dcfff';
      gZn.addLayer(L.circleMarker(ll(p.x,p.y),{radius:9,color:'#fff',weight:3,fillColor:c,fillOpacity:.95}).bindTooltip(p.nazwa+` (${p.x},${p.y},z${p.z})`,{className:'lbl',permanent:p.typ==='wejscie',direction:'top',offset:[0,-8]}))}};
  $('wZn').onchange=rys;
  if(znDane)return rys();
  fetch('/api/znaczniki').then(r=>r.json()).then(d=>{znDane=d;rys()}).catch(()=>{});
}
let dane=[],filtr='',zas=null;
function spawny(){
  gSp.clearLayers();
  fetch('/api/spawny?z='+piet).then(r=>r.json()).then(l=>{for(const x of l){x._ll=ll(x.x,x.y);x._n=x.n.toLowerCase();x._k=kol(x.n)}dane=l;rysujSpawnyTeraz();legenda()})
}
function kol(n){let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return `hsl(${h%360},75%,60%)`}
function legenda(){
  const per={};dane.forEach(s=>per[s.n]=(per[s.n]||0)+s.il);
  $('leg').innerHTML=Object.entries(per).sort((a,b)=>b[1]-a[1]).slice(0,40).map(([n,k])=>`<div class="gr" data-n="${n}"><span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${kol(n)};margin-right:6px"></i>${n}</span><b>${k}</b></div>`).join('');
  $('leg').querySelectorAll('.gr').forEach(e=>e.onclick=()=>{$('szuk').value=e.dataset.n;$('szuk').oninput({target:$('szuk')})});
}
let tim=null;
function rysujSpawny(){clearTimeout(tim);tim=setTimeout(rysujSpawnyTeraz,120)}
const MAKS=900;
function rysujSpawnyTeraz(){
  gSp.clearLayers();
  if(!$('wSp').checked)return;
  const f=filtr.toLowerCase(),B=map.getBounds().pad(.15),z=map.getZoom();
  let wid=[];
  const fl=f?f.split(',').map(x=>x.trim()).filter(Boolean):[];
  for(const s of dane){if(fl.length&&!fl.some(x=>s._n===x||s._n.includes(x)&&x.length>3))continue;if(B.contains(s._ll))wid.push(s)}
  if(wid.length>MAKS){const c=map.getCenter();wid.sort((a,b)=>c.distanceTo(a._ll)-c.distanceTo(b._ll));wid=wid.slice(0,MAKS)}
  const dalekoMapa=wid.length>300;
  // etykiety stałe tylko gdy jest miejsce i bez nakładania
  const zajete=[],pokaz=new Set();
  if(z>=2.5||wid.length<=40)for(const s of wid){const p=map.latLngToLayerPoint(s._ll),w=s.n.length*6.5+14;
    if(zajete.every(q=>Math.abs(q[0]-p.x)>(q[2]+w)/2||Math.abs(q[1]-p.y)>16)){zajete.push([p.x,p.y,w]);pokaz.add(s)}if(pokaz.size>60)break}
  for(const s of wid){
    const c=L.circleMarker(s._ll,{radius:dalekoMapa?4:6,color:'#fff',weight:dalekoMapa?0:1,fillColor:s._k,fillOpacity:.95,interactive:!dalekoMapa});
    const txt=s.n+(s.il>1?' ×'+s.il:'');
    if(pokaz.has(s))c.bindTooltip(txt,{className:'lbl',direction:'top',offset:[0,-4],permanent:true});
    else if(!dalekoMapa)c.once('mouseover',()=>c.bindTooltip(txt,{className:'lbl',direction:'top',offset:[0,-4]}).openTooltip());
    if(!dalekoMapa)c.on('click',()=>{
      L.popup().setLatLng(s._ll).setContent(`<b>${s.n}</b><br>ilość: ${s.il}, promień: ${s.r}<br>respawn: ${s.t??'?'} s<br>HP ${s.hp??'?'}, exp ${s.exp??'?'}<br>${s.x}, ${s.y}, z${s.z}`).openOn(map);
      if(zas)map.removeLayer(zas);
      if(s.r>0)zas=L.rectangle([[-(s.y+s.r),s.x-s.r],[-(s.y-s.r)+1,s.x+s.r+1]],{color:'#e0af68',weight:2,fill:true,fillOpacity:.1,interactive:false}).addTo(map)});
    gSp.addLayer(c);
    if($('wZas').checked&&s.r>0&&wid.length<=150)gSp.addLayer(L.rectangle([[-(s.y+s.r),s.x-s.r],[-(s.y-s.r)+1,s.x+s.r+1]],{color:'#bb9af7',weight:1,fill:true,fillOpacity:.07,interactive:false}));
  }
}
['wSp','wZas'].forEach(i=>$(i).onchange=rysujSpawny);
document.querySelectorAll('.pre').forEach(b=>b.onclick=()=>{ustaw(Math.max(piet,8)===piet?piet:(b.dataset.f.includes('rat')?8:piet));$('szuk').value=b.dataset.f;$('szuk').oninput({target:$('szuk')})});
$('szuk').oninput=e=>{filtr=e.target.value.trim();rysujSpawny();podsum()};
function podsum(){
  const w=$('wynik');w.innerHTML='';if(!filtr)return;
  fetch('/api/spawny').then(r=>r.json()).then(l=>{
    const fl=filtr.toLowerCase().split(',').map(x=>x.trim()).filter(Boolean),t=l.filter(s=>{const n=s.n.toLowerCase();return fl.some(x=>n===x||n.includes(x)&&x.length>3)});
    const per={};t.forEach(s=>per[s.z]=(per[s.z]||0)+1);
    w.innerHTML=Object.entries(per).sort((a,b)=>+a[0]-+b[0]).map(([z,n])=>`<div class="gr" data-z="${z}"><span>piętro ${z}</span><b>${n}</b></div>`).join('')||'brak';
    w.querySelectorAll('.gr').forEach(e=>e.onclick=()=>{ustaw(+e.dataset.z);const p=t.filter(s=>s.z===+e.dataset.z);const b=L.latLngBounds(p.map(s=>ll(s.x,s.y)));map.fitBounds(b.pad(.3),{maxZoom:3})})
  })
}
$('idz').onkeydown=e=>{if(e.key!=='Enter')return;const m=e.target.value.match(/(\d+)\D+(\d+)(?:\D+(\d+))?/);if(!m)return;if(m[3]!==undefined)ustaw(+m[3]);map.setView(ll(+m[1],+m[2]),4)};
map.on('mousemove',e=>{$('info').textContent=`x ${Math.floor(e.latlng.lng)}, y ${Math.floor(-e.latlng.lat)}, z ${piet}`});
map.on('click',e=>{const t=`${Math.floor(e.latlng.lng)} ${Math.floor(-e.latlng.lat)} ${piet}`;navigator.clipboard?.writeText(t).catch(()=>{})});
let ostatniSig='',ostatni=null,mark={},pierwszy=true,zlive=null;
function stwory(){}
async function live(){
  let o;try{o=await (await fetch('/api/live')).json()}catch(e){$('gracze').textContent='serwer nie odpowiada';return}
  const sig=JSON.stringify([o.gracze,piet,$('wSt').checked]);if(sig===ostatniSig)return;ostatniSig=sig;
  gGr.clearLayers();gSt.clearLayers();
  const g=o.gracze.filter(x=>x.x!==undefined);
  $('gracze').innerHTML=g.length?g.map(x=>`<div class="gr" data-i="${x.id}"><span><b>${x.nazwa}</b> ${x.id==='domyslna'?'':'('+x.id+')'}</span><span>${x.x},${x.y},z${x.z}</span></div>`).join(''):'brak gry (mapa i spawny działają)';
  $('gracze').querySelectorAll('.gr').forEach(e=>e.onclick=()=>{const x=g.find(v=>v.id===e.dataset.i);if(x){ustaw(x.z);map.setView(ll(x.x,x.y),4)}});
  for(const x of g){
    if(x.z===piet){
      gGr.addLayer(L.marker(ll(x.x,x.y),{icon:L.divIcon({className:'',html:'<div class="pg"></div>',iconSize:[14,14],iconAnchor:[7,7]}),zIndexOffset:1000}).bindTooltip(x.nazwa,{permanent:true,className:'lbl',direction:'right',offset:[10,0]}));
      if($('wSt').checked)for(const s of x.stwory||[])if(s.z===piet)gSt.addLayer(L.circleMarker(ll(s.x,s.y),{radius:4,color:'#16161e',weight:1,fillColor:s.g?'#7dcfff':'#f7768e',fillOpacity:1}).bindTooltip(s.n+(s.hp!=null?` ${s.hp}%`:''),{className:'lbl'}));
    }
  }
  if(g.length&&$('wFol').checked){
    const x=g[0];
    if(zlive!==null&&x.z!==zlive&&x.z!==piet)ustaw(x.z);
    if(pierwszy){ustaw(x.z);map.setView(ll(x.x,x.y),3);pierwszy=false}
    else if(x.z===piet){const p=map.latLngToContainerPoint(ll(x.x,x.y)),s=map.getSize();if(p.x<80||p.y<80||p.x>s.x-80||p.y>s.y-80)map.panTo(ll(x.x,x.y),{animate:true,duration:.6})}
    zlive=x.z;
  }
}
map.on('moveend',rysujSpawny);
map.setView(ll(32369,32241),1);ustaw(piet);
setInterval(live,1500);live();
</script></body></html>
